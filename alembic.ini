# Alembic single-database configuration

[alembic]
# Migration script directory
script_location = alembic

# Migration filename template. Default: %%(rev)s_%%(slug)s
# Uncomment below to prepend date/time to revision filenames.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Extra path prepended to sys.path
prepend_sys_path = .

# Timezone used when rendering revision timestamps
# timezone =

# Max slug length
# truncate_slug_length = 40

# Whether to always run env.py during `revision`
# revision_environment = false

# Whether sourceless revision files are allowed
# sourceless = false

# Version directories configuration
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Path separator for version_locations
# Allowed: ":", ";", "space", "os"
version_path_separator = os

# Whether to search version directories recursively
# recursive_version_locations = false

# Output encoding for generated revision files
# output_encoding = utf-8

# Placeholder URL. Overridden in alembic/env.py at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Hooks executed after generating a revision file

# Format revisions with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Auto-fix revisions with ruff
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
